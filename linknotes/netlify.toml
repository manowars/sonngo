# Netlify site config for LinkNotes.
# In Netlify: Site configuration → Build & deploy → set
#   Base directory   = linknotes
#   Publish directory = linknotes/web
# (the values below already do this when the base directory is `linknotes`)

[build]
  publish = "web"
  functions = "netlify/functions"
  command = "node scripts/make-icons.mjs"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Single-page app: share-target URLs (/?url=…) must resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
