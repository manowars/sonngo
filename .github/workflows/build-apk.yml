name: Build LinkNotes APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'linknotes/web/**'
      - 'linknotes/android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linknotes/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu-latest image already ships the Android SDK, so there is
      # nothing to install beyond the platform this project compiles against.
      # (android-actions/setup-android fails here: it installs the obsolete
      # "tools" package, which Google removed from the SDK repository.)
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the web app into www/
        run: node prepare.mjs

      - name: Generate the native Android project
        run: npx cap add android

      - name: Apply LinkNotes patches (share intent, name, icons)
        run: node patch-android.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew --no-daemon assembleDebug

      - name: Name the artifact
        id: name
        run: echo "file=LinkNotes-debug-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - name: Stage the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.name.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linknotes-apk
          path: linknotes/android/${{ steps.name.outputs.file }}
          if-no-files-found: error
          retention-days: 90

      # Actions artifacts need a login and arrive as a zip, which is awkward
      # to install from a phone. A release gives a direct .apk link.
      - name: Publish a release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linknotes-${{ github.run_number }}
          name: LinkNotes build ${{ github.run_number }}
          prerelease: true
          body: |
            APK debug, build từ `${{ github.sha }}`.

            Cài đặt: mở link `.apk` bên dưới **bằng trình duyệt trên điện thoại**,
            tải về rồi mở file, cho phép "Cài ứng dụng không rõ nguồn gốc" khi
            Android hỏi.

            Bản debug ký bằng khoá debug — đủ để tự cài, không đưa lên Play Store được.
          files: linknotes/android/${{ steps.name.outputs.file }}
