name: Build LinkNotes APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also attach the APK to a GitHub Release'
        type: boolean
        default: false
  push:
    paths:
      - 'linknotes/web/**'
      - 'linknotes/android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linknotes/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the web app into www/
        run: node prepare.mjs

      - name: Generate the native Android project
        run: npx cap add android

      - name: Apply LinkNotes patches (share intent, name, icons)
        run: node patch-android.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew --no-daemon assembleDebug

      - name: Name the artifact
        id: name
        run: echo "file=LinkNotes-debug-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - name: Stage the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.name.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linknotes-apk
          path: linknotes/android/${{ steps.name.outputs.file }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish a release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linknotes-${{ github.run_number }}
          name: LinkNotes build ${{ github.run_number }}
          body: |
            Debug APK built from `${{ github.sha }}`.

            Cài đặt: tải file `.apk`, mở trên điện thoại, cho phép
            "Cài ứng dụng không rõ nguồn gốc" khi Android hỏi.
          files: linknotes/android/${{ steps.name.outputs.file }}
