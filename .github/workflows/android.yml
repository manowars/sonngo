name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug and release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Name APKs by version
        id: apk
        working-directory: android
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/docscan-v$version-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/docscan-v$version-debug.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -lh ../dist

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: docscan-v${{ steps.apk.outputs.version }}-release-apk
          path: dist/*-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: docscan-v${{ steps.apk.outputs.version }}-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error

      # Phát hành APK dưới dạng release để tải thẳng về điện thoại,
      # không cần đăng nhập GitHub và không phải giải nén như artifact.
      - name: Publish APK to the v1.0 release
        if: github.ref == 'refs/heads/claude/android-document-scanner-app-q8qdma'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.apk.outputs.version }}"
          tag="v$version"
          notes="DocScan $tag - ứng dụng quét tài liệu.

          Tải file docscan-$tag-release.apk rồi mở để cài (cần cho phép cài từ nguồn không rõ).
          Bản release được ký bằng khoá debug nên cài thử được ngay.

          Build từ commit ${{ github.sha }}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" dist/*.apk --title "DocScan $tag" --notes "$notes"
          fi
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes  \(.url)"'
