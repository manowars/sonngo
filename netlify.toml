# Netlify config for the personal website (repo root).
# LinkNotes is a separate Netlify site whose base directory is linknotes/
# and which uses linknotes/netlify.toml instead of this file.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
